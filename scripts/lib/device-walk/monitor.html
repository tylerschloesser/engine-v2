<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device round monitor</title>
<style>
  :root { --bg:#fff; --fg:#14171a; --muted:#5b6670; --line:#d5dbe0; --card:#f5f7f9; --pass:#1a7f37; --fail:#c62828; --skip:#8a6d00; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#eef1f3; --muted:#9aa5ae; --line:#323a41; --card:#1d2227; --pass:#4cc26a; --fail:#ff6b6b; --skip:#e3b341; --accent:#7aa7ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 -apple-system, system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .state { font-size:28px; font-weight:700; }
  .dim { color:var(--muted); font-size:15px; }
  .bar { height:8px; background:var(--card); border-radius:4px; margin:8px 0; overflow:hidden; width:min(420px,80vw); }
  .bar i { display:block; height:100%; background:var(--accent); }
  .join img { width:150px; height:150px; background:#fff; border:1px solid var(--line); border-radius:6px; }
  .join code { word-break:break-all; font-size:12px; }
  .prompt { margin:14px 20px; padding:12px 16px; background:var(--card); border-left:6px solid var(--accent); border-radius:6px; }
  main { padding:0 20px 40px; }
  table { border-collapse:collapse; width:100%; }
  td, th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:15px; }
  th { color:var(--muted); font-weight:600; }
  .r-pass { color:var(--pass); font-weight:700; } .r-fail { color:var(--fail); font-weight:700; } .r-skip { color:var(--skip); font-weight:700; } .r-open { color:var(--muted); }
  tr.cur td { background:var(--card); }
  button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:3px 9px; cursor:pointer; margin-right:4px; }
  button:hover { border-color:var(--accent); }
  details pre { margin:4px 0 0; font-size:12px; max-height:180px; overflow:auto; white-space:pre-wrap; }
  .toolbar { margin:14px 0; }
</style>
</head>
<body>
<header>
  <div>
    <div class="state" id="state">...</div>
    <div class="dim" id="reason"></div>
    <div class="bar"><i id="fill" style="width:0"></i></div>
    <div class="dim" id="phone"></div>
  </div>
  <div class="join" id="join"></div>
</header>
<div class="prompt" id="prompt" hidden></div>
<main>
  <div class="toolbar"><button type="button" id="back" title="Redo the check that finished last">Back (redo the last finished check)</button></div>
  <table><thead><tr><th>check</th><th>result</th><th>by</th><th>attempts</th><th>numbers and notes</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
let S = null
let joinShown = ''
const open = new Set()

async function post(ev) {
  const r = await fetch('/api/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(ev) })
  S = await r.json()
  draw()
}
function draw() {
  if (!S) return
  $('state').textContent = S.state
  $('state').className = 'state ' + (S.state === 'done' ? 'r-pass' : S.state === 'stalled' ? 'r-fail' : '')
  $('reason').textContent = S.reason || ''
  $('fill').style.width = (S.total ? (100 * S.recorded) / S.total : 0) + '%'
  const p = S.phone || {}
  $('phone').textContent = `${S.recorded}/${S.total} recorded · phone ${p.connected ? 'connected' : 'not connected'}${p.lastSeen ? `, last seen ${p.secondsSince} s ago (${p.lastSeen})` : ''}`
  if (S.joinUrl && S.joinUrl !== joinShown) {
    joinShown = S.joinUrl
    $('join').innerHTML = `<img src="/api/qr?text=${encodeURIComponent(S.joinUrl)}" alt="QR code"><div><code>${esc(S.joinUrl)}</code></div>`
  }
  const cur = S.current
  $('prompt').hidden = !cur || !cur.prompt
  if (cur && cur.prompt) $('prompt').innerHTML = `<b>${esc(cur.id)}</b> (${esc(cur.prompt.kind)}): ${esc(cur.prompt.text)}`
  $('rows').innerHTML = S.items.map((r) => {
    const res = r.result || 'open'
    const crit = (r.criteria || []).map((c) => `${c.ok === true ? 'ok  ' : c.ok === false ? 'FAIL' : 'judge'} ${c.name}: ${JSON.stringify(c.value)} (limit ${JSON.stringify(c.limit)})`).join('\n')
    const tries = (r.attempts || []).map((a) => `#${a.n} ${a.status}${a.reason ? ' (' + a.reason + ')' : ''}${a.outcome ? ' ' + a.outcome : ''}`).join(', ')
    return `<tr class="${cur && cur.id === r.id ? 'cur' : ''}"><td>${esc(r.id)}</td><td class="r-${res === 'pass' || res === 'fail' || res === 'skip' ? res : 'open'}">${esc(res)}</td><td>${esc(r.by || '')}</td><td>${esc(tries)}</td>
      <td>${esc(r.notes || '')}${crit || r.numbers ? `<details data-id="${esc(r.id)}" ${open.has(r.id) ? 'open' : ''}><summary>details</summary><pre>${esc(crit)}${r.numbers ? '\n' + esc(r.numbers) : ''}${r.evidence ? '\nevidence: ' + esc(r.evidence) : ''}</pre></details>` : ''}</td>
      <td>${r.result ? `<button type="button" data-redo="${esc(r.id)}">Redo</button>` : ''}${['pass', 'fail', 'skip'].map((v) => `<button type="button" data-set="${esc(r.id)}|${v}">${v}</button>`).join('')}</td></tr>`
  }).join('')
}
document.addEventListener('click', (e) => {
  const t = e.target
  if (t.dataset.redo) post({ type: 'redo', id: t.dataset.redo })
  else if (t.dataset.set) { const [id, result] = t.dataset.set.split('|'); post({ type: 'result', id, result, notes: 'set on the Mac' }) }
  else if (t.id === 'back' && S) { const last = [...S.items].filter((r) => r.result).sort((a, b) => String(b.history.at(-1)?.t).localeCompare(String(a.history.at(-1)?.t)))[0]; if (last) post({ type: 'redo', id: last.id }) }
})
document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.id) d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id) }, true)
async function poll() {
  try { S = await (await fetch('/api/status')).json(); draw() } catch {}
  setTimeout(poll, 1500)
}
poll()
</script>
</body>
</html>
