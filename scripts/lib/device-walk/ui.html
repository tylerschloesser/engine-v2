<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device walkthrough</title>
<style>
  :root { --bg:#fff; --fg:#14171a; --muted:#5b6670; --line:#d5dbe0; --card:#f5f7f9; --pass:#1a7f37; --fail:#c62828; --skip:#8a6d00; --nr:#5b6670; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#eef1f3; --muted:#9aa5ae; --line:#323a41; --card:#1d2227; --pass:#4cc26a; --fail:#ff6b6b; --skip:#e3b341; --nr:#9aa5ae; --accent:#7aa7ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:20px/1.5 -apple-system, system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 20px; }
  .pos { font-size:30px; font-weight:700; }
  .pos small { font-size:20px; font-weight:400; color:var(--muted); margin-left:12px; }
  .bar { height:8px; background:var(--card); border-radius:4px; margin:8px 0; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .srv { font-size:17px; color:var(--muted); word-break:break-all; }
  .srv b { color:var(--fg); }
  .srv .st-ready { color:var(--pass); } .srv .st-failed { color:var(--fail); }
  .layout { display:grid; grid-template-columns:300px 1fr; gap:24px; padding:20px; max-width:1500px; margin:auto; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } nav.list { max-height:240px; } }
  nav.list { overflow:auto; max-height:calc(100vh - 170px); position:sticky; top:150px; align-self:start; font-size:16px; }
  nav.list h4 { margin:14px 0 4px; color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.05em; }
  nav.list button { display:flex; width:100%; gap:8px; text-align:left; background:none; border:0; border-radius:6px; padding:4px 8px; color:var(--fg); font:inherit; cursor:pointer; }
  nav.list button:hover { background:var(--card); } nav.list button.cur { background:var(--card); outline:2px solid var(--accent); }
  .dot { width:1.2em; flex:none; text-align:center; }
  .r-pass { color:var(--pass); } .r-fail { color:var(--fail); } .r-skip { color:var(--skip); } .r-nr { color:var(--nr); }
  h1 { font-size:32px; margin:0 0 4px; word-break:break-word; } h1 small { display:block; font-size:18px; color:var(--muted); font-weight:400; }
  .block { background:var(--card); border-radius:10px; padding:12px 16px; margin:14px 0; }
  .block h3 { margin:0 0 4px; font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  code { font:0.9em ui-monospace, Menlo, monospace; background:rgba(127,127,127,.18); padding:1px 5px; border-radius:4px; }
  .page { display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
  .page img { width:min(420px, 80vw); height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .url { font:20px ui-monospace, Menlo, monospace; word-break:break-all; }
  button.btn, .btn { font:inherit; font-weight:600; border:2px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; padding:10px 18px; cursor:pointer; }
  button.btn:hover { border-color:var(--accent); }
  .res { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
  .res .btn { font-size:22px; padding:14px 22px; }
  .res .btn.on.pass { background:var(--pass); color:#fff; border-color:var(--pass); } .res .btn.on.fail { background:var(--fail); color:#fff; border-color:var(--fail); }
  .res .btn.on.skip { background:var(--skip); color:#fff; border-color:var(--skip); } .res .btn.on.nr { background:var(--nr); color:#fff; border-color:var(--nr); }
  textarea, input { width:100%; font:inherit; padding:8px 10px; border:2px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  label { display:block; font-size:15px; color:var(--muted); margin:10px 0 2px; }
  .row3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .nav { display:flex; gap:12px; margin:18px 0; align-items:center; }
  .nav .sp { flex:1; }
  .hist { font-size:16px; color:var(--muted); } .hist div { padding:2px 0; }
  .warn { color:var(--fail); font-weight:600; }
  details { margin-top:6px; } pre { margin:6px 0 0; font-size:13px; max-height:160px; overflow:auto; white-space:pre-wrap; }
  .done { background:var(--pass); color:#fff; border-radius:10px; padding:12px 16px; margin:14px 0; }
  .keys { color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<header>
  <div class="pos" id="pos"></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="srv" id="srv"></div>
</header>
<div class="layout">
  <nav class="list" id="list"></nav>
  <main id="main"></main>
</div>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>')
const RES = [['pass', 'Pass', 'pass', '1'], ['fail', 'Fail', 'fail', '2'], ['skip', 'Skip', 'skip', '3'], ['not run: no device', 'Not run', 'nr', '4']]
const SYM = { pass: ['✓', 'r-pass'], fail: ['✗', 'r-fail'], skip: ['–', 'r-skip'], 'not run: no device': ['○', 'r-nr'] }
let S = null
let shownCursor = null
let shownUrls = ''
let pageIdx = 0
let logOpen = false
let lastHeader = ''
const drafts = {}

async function post(ev) {
  const r = await fetch('/api/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(ev) })
  S = await r.json()
  return S
}
const cur = () => S.items.find((i) => i.id === S.cursor)
const idx = () => S.items.findIndex((i) => i.id === S.cursor)
const go = async (i) => { const it = S.items[Math.max(0, Math.min(S.items.length - 1, i))]; await post({ type: 'cursor', id: it.id }); render(true) }

function renderHeader() {
  const done = S.items.filter((i) => i.result).length
  $('pos').innerHTML = `Item ${S.position} of ${S.total}<small>round “${esc(S.round)}” · ${done} recorded</small>`
  $('barfill').style.width = `${(100 * done) / S.total}%`
  const v = S.server
  const a = v.args ? `device-serve ${v.args.join(' ') || '(plain)'}` : 'no server running'
  const url = v.urls.tunnel ?? v.urls.loopback ?? ''
  const html = `Server: <b>${esc(a)}</b> · <span class="st-${v.status}">${esc(v.status)}</span>${url ? ` · ${esc(url)}` : ''}${v.error ? ` · <span class="warn">${esc(v.error)}</span>` : ''}` +
    `<details id="logd" ${logOpen ? 'open' : ''}><summary>server log</summary><pre>${esc(v.log.join('\n'))}</pre></details>` +
    `<button class="btn" style="font-size:14px;padding:2px 10px" onclick="post({type:'restart'})">restart server</button>`
  if (html !== lastHeader) { lastHeader = html; $('srv').innerHTML = html; $('logd').addEventListener('toggle', (e) => { logOpen = e.target.open }) }
}

function renderList() {
  let html = ''
  let sec = ''
  for (const [n, it] of S.items.entries()) {
    if (it.section !== sec) { sec = it.section; html += `<h4>${esc(sec)} ${esc(it.heading)}</h4>` }
    const [sym, cls] = SYM[it.result] ?? ['·', '']
    html += `<button class="${it.id === S.cursor ? 'cur' : ''}" onclick="go(${n})"><span class="dot ${cls}">${sym}</span><span>${esc(it.id)}</span></button>`
  }
  const keep = $('list').scrollTop
  $('list').innerHTML = html
  $('list').scrollTop = keep
}

function pageBlock(it) {
  const s = it.serving
  if (s.device === 'none') return '<div class="block"><h3>Page</h3>No page to open for this item.</div>'
  const url = it.urls[Math.min(pageIdx, it.urls.length - 1)]
  const pick = it.urls.length > 1 ? `<div class="res">${it.urls.map((u, n) => `<button class="btn ${n === pageIdx ? 'on pass' : ''}" onclick="pageIdx=${n};renderPage()">${esc(s.pages[n])}</button>`).join('')}</div>` : ''
  const where = s.device === 'mac' ? 'Open on the Mac (loopback, no QR needed)' : s.fly ? 'Scan with the iPhone (hosted Fly URL; Wi-Fi off for M38)' : 'Scan with the iPhone'
  if (!url) {
    const v = S.server
    return `<div class="block"><h3>${where}</h3>${pick}<div>Starting the server… ${esc(v.status)} (a build takes a while)</div><pre>${esc(v.log.slice(-3).join('\n'))}</pre>${v.status === 'failed' ? `<div class="warn">${esc(v.error)}</div>` : ''}</div>`
  }
  const qr = s.device === 'phone' ? `<img alt="QR code for ${esc(url)}" src="/api/qr?text=${encodeURIComponent(url)}">` : ''
  return `<div class="block"><h3>${where}</h3>${pick}<div class="page">${qr}<div><div class="url"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div><p><button class="btn" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(url))})">Copy URL</button></p>${s.device === 'phone' && !s.fly ? '<p class="keys">The tunnel can take a few seconds to resolve on first use; reload if Safari cannot find the server.</p>' : ''}</div></div></div>`
}
function renderPage() { const it = cur(); const el = $('pageblock'); if (el) el.innerHTML = pageBlock(it); shownUrls = it.urls.join('|') + S.server.status }

function renderMain() {
  const it = cur()
  const d = drafts[it.id] ?? { notes: it.notes, numbers: it.numbers }
  const hist = it.history.length ? `<div class="block hist"><h3>History (both runs are kept)</h3>${it.history.map((h) => `<div>${esc(h.t.replace('T', ' ').slice(0, 19))} · ${h.redo ? '<em>reopened</em>' : `<strong class="${SYM[h.result][1]}">${esc(h.result)}</strong>${h.notes ? ` · ${esc(h.notes)}` : ''}${h.numbers ? ` · numbers: ${esc(h.numbers)}` : ''}`}</div>`).join('')}</div>` : ''
  const devHint = !S.device.phone || !S.device.ios
  const done = S.items.every((i) => i.result)
  $('main').innerHTML =
    (done ? `<div class="done">All ${S.total} items have a result. Next: <code>pnpm device:walk --apply ${esc(S.round)} --dry-run</code>, then without <code>--dry-run</code>.</div>` : '') +
    `<h1>${esc(it.id)}<small>${esc(it.section)} · ${esc(it.heading)}</small></h1>` +
    (it.lead ? `<div class="block">${md(it.lead)}</div>` : '') +
    (it.steps ? `<div class="block"><h3>Steps</h3>${md(it.steps)}</div>` : '') +
    (it.pass ? `<div class="block"><h3>Pass</h3>${md(it.pass)}</div>` : '') +
    (it.ifFails ? `<div class="block"><h3>If it fails</h3>${md(it.ifFails)}</div>` : '') +
    `<div id="pageblock"></div>` +
    `<div class="res">${RES.map(([v, label, cls, k]) => `<button class="btn ${cls} ${it.result === v ? 'on' : ''}" onclick="setResult(${esc(JSON.stringify(v))})">${label} <span class="keys">${k}</span></button>`).join('')}${it.result ? '<button class="btn" onclick="redo()">Redo (reopen)</button>' : ''}</div>` +
    `<label for="notes">Notes</label><textarea id="notes" rows="3">${esc(d.notes)}</textarea>` +
    `<label for="numbers">Numbers asked for by the item (HUD readings, ms, MiB)</label><textarea id="numbers" rows="2">${esc(d.numbers)}</textarea>` +
    hist +
    `<div class="nav"><button class="btn" onclick="go(idx()-1)">← Back</button><button class="btn" onclick="go(idx()+1)">Next →</button><span class="sp"></span><span class="keys">← → move · 1 2 3 4 set result (outside the text boxes)</span></div>` +
    `<details ${devHint ? 'open' : ''}><summary>Devices (recorded once per round)</summary><div class="row3">` +
    [['phone', 'iPhone model'], ['ios', 'iOS version'], ['mac', 'Mac (macOS, browser versions)']].map(([k, l]) => `<div><label>${l}</label><input data-dev="${k}" value="${esc(S.device[k])}"></div>`).join('') + `</div></details>`
  for (const id of ['notes', 'numbers']) $(id).addEventListener('input', () => { drafts[it.id] = { notes: $('notes').value, numbers: $('numbers').value }; clearTimeout(window.t); window.t = setTimeout(saveDraft, 500) })
  for (const el of document.querySelectorAll('[data-dev]')) el.addEventListener('change', () => post({ type: 'device', [el.dataset.dev]: el.value }))
  renderPage()
}
async function saveDraft() { const it = cur(); if (it.result) { await post({ type: 'result', id: it.id, result: it.result, notes: $('notes').value, numbers: $('numbers').value }); renderList() } }
async function setResult(v) {
  const it = cur()
  await post({ type: 'result', id: it.id, result: v, notes: $('notes').value, numbers: $('numbers').value })
  delete drafts[it.id]
  if (v === 'pass' && idx() < S.items.length - 1) return go(idx() + 1)
  render(true)
}
async function redo() { const it = cur(); delete drafts[it.id]; await post({ type: 'redo', id: it.id }); render(true) }

function render(force) {
  renderHeader(); renderList()
  if (force || shownCursor !== S.cursor) { shownCursor = S.cursor; pageIdx = 0; renderMain() }
  else if (shownUrls !== cur().urls.join('|') + S.server.status) renderPage()
}
document.addEventListener('keydown', (e) => {
  if (!S || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey) return
  if (e.key === 'ArrowRight') go(idx() + 1)
  else if (e.key === 'ArrowLeft') go(idx() - 1)
  else { const r = RES.find((x) => x[3] === e.key); if (r) setResult(r[0]) }
})
async function poll() { try { S = await (await fetch('/api/state')).json(); render(false) } catch {} setTimeout(poll, 1000) }
poll()
</script>
</body>
</html>
