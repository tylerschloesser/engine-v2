[package]
name = "determinism-hash"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "native"
path = "src/main.rs"

[dependencies]
# Pure-Rust libm, pinned exactly: only used by the "risky_libm" variant to test
# whether transcendentals from an in-crate software libm match native <-> wasm.
# It has a build script, so it needs a working host C linker; hence optional.
libm = { version = "=0.2.15", optional = true }

[features]
libm-crate = ["dep:libm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-s]
inherits = "release"
opt-level = "s"

[profile.dev]
panic = "abort"

# Standalone: not part of any parent workspace.
[workspace]
