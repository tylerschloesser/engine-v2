# One Durable Object per world id (docs/decisions/0009, docs/plan/38-hosting-checks.md Scope A).
# Not in `pnpm test`; run `node scripts/stage.mjs <payload>` first (it fills `.stage/`).
name = "engine-v2-ref-do"
main = "src/worker.mjs"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "WorldDO"

# SQLite-backed storage (Cloudflare's recommended backend): values up to 2 MB, so the adapter's
# 1 MiB part objects fit.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldDO"]
