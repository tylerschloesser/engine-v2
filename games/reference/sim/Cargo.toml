[package]
name = "reference-sim"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"] # cdylib -> the .wasm; rlib -> native tests and the bindings step

[features]
# M34b: never enabled by `vite build`. `SCHEMA_VERSION + 1` and a poison `StartCraft` (recipe 255
# panics in `apply`), for the two `slow` tests built through `buildGame({ features })`.
test-hooks = []
# M36: the standard large save (0020 section 9) and its bench worldgen marker, for the tick and frame
# benchmarks. Never enabled by `vite build` or the fast tier's `.wasm`; `buildGame({ features:
# ['bench'] })` (dir `target/engine/<profile>+bench`) is the only way in. Native tests turn it on
# through the self dev-dependency below.
bench = ["engine/bench-phases"]
# M36b: forwards the engine's `measure-diff` counters (what a byte-mask diff of entity puts would
# have sent). Measurement only; `buildGame({ features: ['measure-diff'] })` is the only way in.
measure-diff = ["engine/measure-diff"]

[lints]
workspace = true

[dependencies]
# In-repo direct relative path, never through node_modules (0017 §1, §6).
engine = { path = "../../../packages/engine/crates/engine" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
ts-rs = "12"

[dev-dependencies]
# Turns `bench` on for this crate's own test builds (`tests/large_save.rs`), so the fast
# `large_save_builder_is_deterministic` runs under a plain `cargo nextest run`. Never part of the
# `.wasm` (`buildGame` builds no dev-dependencies).
reference-sim = { path = ".", features = ["bench"] }
engine = { path = "../../../packages/engine/crates/engine", features = ["testing"] }
# `landmarks_fixture.rs` alone: parses `tests/fixtures/landmarks.json` (test-only, never in the
# `.wasm` -- already a dependency elsewhere in the workspace, e.g. `packages/engine/crates/engine`).
serde_json = { version = "1", default-features = false, features = ["alloc"] }
