[package]
name = "fx-busy-field"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"] # cdylib -> the .wasm; rlib -> the native golden test

[features]
# M36b: forwards the engine's `measure-diff` counters (never on in `pnpm test`'s own builds).
measure-diff = ["engine/measure-diff"]

[lints]
workspace = true

[dependencies]
engine = { path = "../../crates/engine" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
ts-rs = "12"

[dev-dependencies]
engine = { path = "../../crates/engine", features = ["testing"] }
