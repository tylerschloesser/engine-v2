[package]
name = "fx-belts"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"] # cdylib -> the .wasm; rlib -> the native tests

[lints]
workspace = true

[dependencies]
engine = { path = "../../crates/engine" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
ts-rs = "12"

[dev-dependencies]
# `bench-phases` (M45): `slow_tick_belts_large` reads the transport advance's own time from
# `engine::bench_phase::take()`. Dev-dependency only, so the `.wasm` never carries it.
engine = { path = "../../crates/engine", features = ["testing", "bench-phases"] }
serde_json = "1"
