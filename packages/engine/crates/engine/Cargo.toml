[package]
name = "engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Native test helpers (`engine::testing`). Dev-dependency use only; never on in a `.wasm` build.
testing = []

# Policy and the exact allowed list: docs/decisions/0017 §7 (checked by scripts/lib/crate-policy.test.mjs).
[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# `Game::Action`/`Reject`/`Worldgen::Params`/`Ui` (0003): type-only until M17 wires the actual
# `cargo test export_bindings` step that writes `bindings/*.ts` into a game package (0017 §7:
# "nothing of it is reachable from an export, so LTO removes it; the size test watches this").
ts-rs = "12"

# Dev-dependencies are unrestricted (0017 §7). `wgsl.terrain_validates` (docs/plan/
# 09-renderer-terrain.md Planning decisions "Bind group layout") parses and validates every
# `.wgsl` file the TypeScript renderer embeds, natively, with no GPU.
[dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

# `golden_codec_sample` uses `engine::assert_golden_bytes!`/`assert_golden_hash!`, feature
# `testing`. In practice always on for `pnpm test rust` (fx-hash's dev-dependency on `engine`
# unifies it across the `--workspace` build); this makes an isolated `cargo test -p engine`
# without `--features testing` skip the target instead of failing to compile.
[[test]]
name = "codec"
required-features = ["testing"]

# `golden_terrain_canonical` uses `engine::assert_golden_bytes!`/`assert_golden_hash!` (feature
# `testing`), same reasoning as `codec` above.
[[test]]
name = "world_terrain"
required-features = ["testing"]

# `engine::testing::{assert_cache_invisible, CacheConfig, TestTerrain, CountingSource}` (feature
# `testing`).
[[test]]
name = "world_cache_invisible"
required-features = ["testing"]

# `engine::assert_golden_hash!` (feature `testing`), same reasoning as `codec` above.
[[test]]
name = "worldgen_noise"
required-features = ["testing"]

# `engine::testing::TestTerrain` and `engine::assert_golden_hash!` (feature `testing`).
[[test]]
name = "worldgen_core"
required-features = ["testing"]

# `engine::testing::testkit::Loopback` (feature `testing`), same reasoning as `codec` above.
[[test]]
name = "connection_and_subscriptions"
required-features = ["testing"]
