[package]
name = "engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Native test helpers (`engine::testing`). Dev-dependency use only; never on in a `.wasm` build.
testing = []

# Policy and the exact allowed list: docs/decisions/0017 §7 (checked by scripts/lib/crate-policy.test.mjs).
[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# `Game::Action`/`Reject`/`Worldgen::Params`/`Ui` (0003): type-only until M17 wires the actual
# `cargo test export_bindings` step that writes `bindings/*.ts` into a game package (0017 §7:
# "nothing of it is reachable from an export, so LTO removes it; the size test watches this").
ts-rs = "12"

# Dev-dependencies are unrestricted (0017 §7). `wgsl.terrain_validates` (docs/plan/
# 09-renderer-terrain.md Planning decisions "Bind group layout") parses and validates every
# `.wgsl` file the TypeScript renderer embeds, natively, with no GPU.
[dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

# `engine::host::Host::queue_action_for_test`, `Host::genesis_for_test` (feature `testing`), and
# its own `#[global_allocator]` (mirrors `no_alloc_terrain`/`no_alloc_authority`).
[[test]]
name = "no_alloc_connection"
required-features = ["testing"]

# `engine::client::CameraBlock::for_test` (feature `testing`), and its own `#[global_allocator]`
# (mirrors `no_alloc_connection`/`no_alloc_terrain`).
[[test]]
name = "no_alloc_ui"
required-features = ["testing"]

# docs/plan/17-drawlist-and-sprites.md: same reason as `no_alloc_ui` above.
[[test]]
name = "no_alloc_drawlist"
required-features = ["testing"]

# docs/plan/24c-engine-edit-rebuild-time.md: every ordinary (non-`#[global_allocator]`,
# non-`runner_control`) integration test lives in `tests/main.rs` (`#[path]`-including
# `tests/main/*.rs`) so cargo links, and macOS ad-hoc-signs, one binary instead of ~14 -- the
# dominant cost of a one-line `crates/engine/src/` edit (Deviations has the measurement). Most of
# `tests/main/*.rs` uses `engine::testing::*` (feature `testing`); a handful (`gen_queue`,
# `module_layering`, `wgsl`) don't need it on their own, same trade as `codec`'s old entry used to
# describe: an isolated `cargo test -p engine` without `--features testing` now skips the whole
# binary rather than failing to compile. In practice always on for `pnpm test rust`/the bindings
# step (fx-hash's dev-dependency on `engine` unifies it across the `--workspace` build).
[[test]]
name = "main"
required-features = ["testing"]
