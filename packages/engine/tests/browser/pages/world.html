<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- suppresses the browser's automatic /favicon.ico request, which openPage() (support/page.ts)
         would otherwise fail the test on as a console error. -->
    <link rel="icon" href="data:," />
    <title>world</title>
    <style>
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        margin: 0;
        padding: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #0f0;
        font: 11px monospace;
        white-space: pre;
        z-index: 1;
      }
      #paint-btn {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1;
        font-size: 16px;
        padding: 8px 16px;
      }
      #world-busy {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 24px;
        background: #900;
        color: #fff;
        font: 16px sans-serif;
        z-index: 2;
      }
      #world-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./src/world.ts"></script>
  </body>
</html>
