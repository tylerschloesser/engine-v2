# Ban lists for the determinism lints turned on in the root Cargo.toml
# ([workspace.lints.clippy]). Owner of the lists: docs/decisions/0002 §2–§3; do not add or remove
# entries without that ADR. They reach the engine crate, every fixture and every game crate
# (`[lints] workspace = true`). An `#[allow]` needs a comment saying why the value cannot
# influence state.

