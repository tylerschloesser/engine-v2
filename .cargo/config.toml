# Repo-wide cargo config (applies to every `cargo`/`cargo nextest` invocation whose CWD is under
# this tree, `.cargo/config.toml`'s own ancestor-directory discovery).
[env]
# ts-rs's bindings step (docs/decisions/0017-packaging-and-build.md §5; docs/plan/
# 16-action-round-trip.md step 4). `TS_RS_IMPORT_EXTENSION = "js"` matches this repo's `nodenext`
# module resolution (`packages/engine/CLAUDE.md`: "Relative imports carry the `.js` extension");
# without it ts-rs emits no extension at all and `tsc` fails.
#
# `TS_RS_EXPORT_DIR` deliberately points at a gitignored scratch directory rather than at the
# committed `bindings/`. The `export_bindings_*` tests are generated by the `TS` derive and run as
# part of the ordinary `rust` suite, so with the export dir aimed at `bindings/` a plain
# `pnpm test` rewrote the committed, `pnpm format`-ed files in ts-rs's raw style and the very next
# `pnpm lint` failed on them: the gate defeating itself, and a dirty tree after every test run.
#
# `packages/engine/src/build-game.ts`'s `exportBindings()` sets `TS_RS_EXPORT_DIR` explicitly in
# the child environment, and cargo's `[env]` does not override an already-set variable (there is
# no `force = true` here), so the real bindings step still writes the real directory. Committed
# bindings are therefore written by `buildGame`/the Vite plugin alone -- which is what 0017 §5
# means by "bindings step", and what M16's "regenerate byte-identically" criterion measures.
TS_RS_EXPORT_DIR = "target/ts-rs-scratch"
TS_RS_IMPORT_EXTENSION = "js"
